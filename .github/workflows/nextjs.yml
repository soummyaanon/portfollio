# Build and verify only. Production is served by Vercel (soumyapanda.dev), which builds and
# deploys on its own; this workflow used to also publish ./out to GitHub Pages, which put a
# second copy of the site on another domain.
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Test agent-facing behavior
        run: npm test
      # Runs the package `build` script rather than `next build` directly, so the build-time
      # generators (sitemap, llms.txt, GitHub data) run in CI too.
      #
      # GITHUB_TOKEN here is the token Actions injects automatically — no secret to configure.
      # It is optional: it only raises the REST rate limit for the commit count. Critically it
      # is not a NEXT_PUBLIC_* name, so it cannot be inlined into the client bundle.
      - name: Build with Next.js
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify generated public endpoints
        run: npm run verify:output
